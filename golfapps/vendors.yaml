    tokens: [flexscape, "yella soft", yellasoft]
    bundle_prefixes: ["com.flexscape."]
    seller_names: ["Yella Soft, Inc.", "Yella Soft"]
    domains: [flexscape.com, yellasoft.com]
    evidence: >
      Yella Soft and Flexscape are ONE vendor, not two: all 12 com.flexscape.* apps are
      published by Yella Soft, Inc. Copyright is the club's name, so seller_name and
