    bundle_prefixes: ["com.teeon."]
    seller_names: ["Tee-On Golf systems Inc."]
    copyright_patterns: ["Tee On Golf Systems", "Tee-On Golf"]
    domains: [teeon.com, "tee-on.com"]
    evidence: "3 apps. Canadian -- expect few US facility links."

  offcourse:
