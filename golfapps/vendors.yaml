    domains: ["pstt.golf", "apps.pstt.golf"]
    evidence: "8 apps, all com.proshopteetimes.* bundles, seller Louisville Computer Guys, Inc. Found 2026-08-19 via privacy_policy_url apps.pstt.golf in Phase 2 residue rows previously carrying no vendor signature (South Park CC, Elk Run GC)."

  shank_tech:
    display_name: CourseRev (Shank Tech, Inc)
    category: booking
    publishing_model: operator_account   # bundle id is per-club, not vendor-prefixed
    tokens: [courserev, shank tech]
    bundle_prefixes: []
    seller_names: ["SHANK TECH, INC"]
    domains: ["courserev.ai"]
    evidence: "1 app so far (Waterford Golf Club, com.waterford) -- seller/artist SHANK TECH, INC, privacy_policy_url courserev.ai. Derek flagged 2026-08-19."
