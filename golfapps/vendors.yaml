      app builder, not necessarily who the course buys from. Treated like the
      Teesnap/Gallus case: seller_name and copyright outrank the bundle prefix.

  uschedule:
    display_name: USchedule
    category: booking
    publishing_model: vendor_account
    tokens: [uschedule]
    bundle_prefixes: ["com.uschedule."]
    seller_names: ["USchedule, LLC", "USchedule"]
    domains: [uschedule.com, "clients.uschedule.com"]
    evidence: >
      63 apps, all published by USchedule, LLC. Copyright is the CLUB's name, not the
      vendor's, so attribution rests on seller_name / bundle / domain.

  bestapproach:
    display_name: Best Approach
    category: booking
    publishing_model: vendor_account
    tokens: [bestapproach, "best approach"]
    bundle_prefixes: ["com.bestapproach."]
    seller_names: ["Best Approach"]
    copyright_patterns: ["Best Approach"]
    domains: [bestapproach.com]
    evidence: "23 apps under com.bestapproach.*, (c) 2016/2017 Best Approach."

