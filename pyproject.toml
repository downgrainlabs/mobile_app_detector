[project]
name = "golfapps"
version = "0.1.0"
description = "Golf facility -> mobile app -> software vendor detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
]

[project.scripts]
golfapps = "golfapps.cli:main"

[project.optional-dependencies]
# Local-only review UI (review_app.py) -- never installed on Render, `pip
# install .` alone (what render.yaml's buildCommand runs) doesn't pull this.
dev = ["streamlit>=1.38"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["golfapps*"]

[tool.setuptools.package-data]
golfapps = ["*.yaml", "*.sql"]
