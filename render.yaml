services:
  - type: cron
    name: mobile-app-detector-monthly
    runtime: python
    plan: standard
    schedule: "0 9 1 * *"
    buildCommand: pip install .
    startCommand: golfapps run-all
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: EVOMI_HOST
        sync: false
      - key: EVOMI_PORT
        sync: false
      - key: EVOMI_USERNAME
        sync: false
      - key: EVOMI_PASSWORD
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
